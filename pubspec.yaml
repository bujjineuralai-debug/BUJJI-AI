
name: bujji_ai
description: A Personal AI Assistant
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.4.0
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  record: ^6.2.1
  audioplayers: ^6.4.0
  path_provider: ^2.1.5
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  google_sign_in: ^6.3.0
  intl_phone_field: ^3.2.0
  cloud_firestore: ^6.10.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/bujji_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/bujji_logo.png"
  min_sdk_android: 21
  
