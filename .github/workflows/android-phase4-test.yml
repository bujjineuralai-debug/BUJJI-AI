name: BUJJI AI Phase 4 Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'phase4/**'

permissions:
  contents: read

concurrency:
  group: phase4-debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build and validate Phase 4 debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup custom Android manifest
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            mkdir -p /tmp/bujji-backup
            cp android/app/src/main/AndroidManifest.xml /tmp/bujji-backup/AndroidManifest.xml
          fi

      - name: Generate missing Android platform files
        run: flutter create --platforms=android .

      - name: Restore custom Android manifest
        run: |
          if [ -f /tmp/bujji-backup/AndroidManifest.xml ]; then
            cp /tmp/bujji-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Set Firebase-compatible Android minimum SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: BUJJI-AI-PHASE4-DEBUG-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
