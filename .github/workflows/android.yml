
name: BUJJI AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backup Custom Android Manifest
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            mkdir -p /tmp/bujji-backup
            cp android/app/src/main/AndroidManifest.xml /tmp/bujji-backup/AndroidManifest.xml
          fi

      - name: Generate Android Project
        run: flutter create --platforms=android .

      - name: Restore Custom Android Manifest
        run: |
          if [ -f /tmp/bujji-backup/AndroidManifest.xml ]; then
            cp /tmp/bujji-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate BUJJI AI Launcher Icon
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUJJI-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
