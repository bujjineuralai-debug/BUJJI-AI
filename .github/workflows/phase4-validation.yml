name: BUJJI AI Phase 4 Validation

on:
  push:
    branches:
      - 'phase4/**'
      - 'implementation/level1-repository-inventory-2026-11-20'
      - 'implementation/level3-error-bug-warning-audit-2026-11-20'
      - 'implementation/level3-bug-fixes-2026-11-20'
      - 'implementation/ui-branding-startup-google-auth-2026-11-20'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase4-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker-syntax:
    name: Cloudflare Worker syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker module syntax
        run: node --input-type=module --check < worker.js
      - name: Run Worker request and fallback tests
        run: node --test test/*.test.mjs

  flutter-validation:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backup custom Android manifest
        run: |
          mkdir -p /tmp/bujji-backup
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/bujji-backup/AndroidManifest.xml
          fi
          if [ -f test/widget_test.dart ]; then
            cp test/widget_test.dart /tmp/bujji-backup/widget_test.dart
          else
            touch /tmp/bujji-backup/widget_test_was_absent
          fi

      - name: Generate missing Android platform files
        run: flutter create --platforms=android .

      - name: Restore custom Android manifest
        run: |
          if [ -f /tmp/bujji-backup/AndroidManifest.xml ]; then
            cp /tmp/bujji-backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -f /tmp/bujji-backup/widget_test.dart ]; then
            cp /tmp/bujji-backup/widget_test.dart test/widget_test.dart
          elif [ -f /tmp/bujji-backup/widget_test_was_absent ]; then
            rm -f test/widget_test.dart
          fi

      - name: Set Firebase-compatible Android minimum SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report debug APK signing certificate fingerprints
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'
          else
            echo "Debug keystore not found; cannot report signing fingerprints."
            exit 1
          fi

      - name: Upload Phase 4 test APK
        uses: actions/upload-artifact@v4
        with:
          name: BUJJI-AI-PHASE4-DEBUG-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
