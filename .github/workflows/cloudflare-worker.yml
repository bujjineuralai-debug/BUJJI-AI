name: BUJJI AI Cloudflare Worker Deploy

on:
  # Production deployment is manual only. Configure required reviewers on
  # the GitHub "production" environment before enabling this workflow.
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy BUJJI AI Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
